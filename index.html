<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KAMI compatibility has moved</title>
    <meta name="description" content="KAMI compatibility is now maintained on the KAMI website.">
    <link rel="canonical" href="https://isjuhn.github.io/KAMI/compatibility/">
    <script>
      // Keep existing links to the PS3 and PS2 sections useful.
      const section = ["#ps3", "#ps2"].includes(location.hash) ? location.hash : "";
      location.replace("https://isjuhn.github.io/KAMI/compatibility/" + section);
    </script>
    <meta http-equiv="refresh" content="0; url=https://isjuhn.github.io/KAMI/compatibility/">
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { max-width: 36rem; margin: 15vh auto; padding: 1.5rem; line-height: 1.6; }
      h1 { font-size: 1.75rem; line-height: 1.2; }
      a { text-underline-offset: .2em; }
    </style>
  </head>
  <body>
    <main>
      <h1>KAMI compatibility has moved</h1>
      <p>The compatibility list is now part of the KAMI website.</p>
      <p><a href="https://isjuhn.github.io/KAMI/compatibility/">Continue to KAMI compatibility</a></p>
      <p>Go directly to <a href="https://isjuhn.github.io/KAMI/compatibility/#ps3">PS3 games</a>
        or <a href="https://isjuhn.github.io/KAMI/compatibility/#ps2">PS2 games</a>.</p>
    </main>
  </body>
</html>
